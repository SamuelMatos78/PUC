<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | PUC Minas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <img class="background" th:src="@{/images/fundo.png}" alt="">

    <main class="auth-layout">
        <aside class="campus" aria-label="PUC Minas">
            <img th:src="@{/images/puc.jpeg}" alt="Ilustração do campus da PUC Minas, com jardins e edifício histórico">
            <div class="campus-caption"><span>PUC Minas</span><p>Conhecimento que transforma.</p></div>
        </aside>
        <section class="panel" aria-labelledby="page-title">
            <header><p class="eyebrow">PUC Minas · Projeto acadêmico</p><h1 id="page-title">Recuperar senha</h1><p class="subtitle">Informe o email utilizado no cadastro.</p></header>

            <p class="message error" role="alert" th:if="${error}" th:text="${error}"></p>
            <p class="message success" role="status" th:if="${message}" th:text="${message}"></p>
            <form th:action="@{/recoverpassword}" method="post">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" th:value="${email}" autocomplete="email" maxlength="255" required>
                <p class="hint">Demonstração acadêmica: esta solicitação não envia email nem altera sua senha.</p>
                <button type="submit">Solicitar recuperação</button>
            </form>
            <nav aria-label="Opções de acesso"><a th:href="@{/login}">Voltar para o login</a></nav>
            <footer>Aplicação acadêmica de autenticação</footer>
        </section>
    </main>
</body>
</html>
